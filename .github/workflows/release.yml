name: Release

on:
  release:
    types:
      - published

env:
  IMAGE_NAME: ghcr.io/kurrawong/rdf-delta

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Get release version
        id: version
        run: echo "VALUE=$(npx --yes semver ${{ github.event.release.tag_name }})" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up and use Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # Set provenance to false due to issue documented here: https://github.com/docker/build-push-action/issues/778
          provenance: false
          # amd64 only. arm64 has no consumer: GSWA's ACR serves amd64
          # servers, and cross-building it under QEMU dominated the run -
          # in 0.2.4-jenafork the same `yum install` step took 5.2s on amd64
          # and 50.5s on arm64, and the two Maven builds carry that factor.
          # Releases were taking 55-74 minutes.
          #
          # Restoring it: either add linux/arm64 back here and accept the
          # wall-clock, or build each platform on a native runner
          # (ubuntu-24.04-arm is free for public repos) and merge the two
          # digests with `docker buildx imagetools create`.
          platforms: linux/amd64
