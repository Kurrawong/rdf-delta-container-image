services:

  delta:
    image: rdf-delta-container-image-delta:latest
    networks:
      - delta
    ports:
      - 1066:1066
    healthcheck:
      test: ["CMD", "curl", "http://localhost:1066"]
      interval: 1s
      timeout: 0.5s
      retries: 3

  fuseki:
    image: rdf-delta-container-image-delta:latest
    ports:
      - 3030:3030
    volumes:
      - ./config.ttl:/opt/rdf-delta/config.ttl
      - ./fuseki/databases:/fuseki/databases
    networks:
      - delta
    command: ["/bin/bash", "-c", "/opt/rdf-delta/fuseki-entrypoint.sh"]
    depends_on:
      delta:
        condition: service_healthy

networks:
  delta:
